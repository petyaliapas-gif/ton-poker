name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: ton_poker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U poker -d ton_poker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://poker:poker@localhost:5432/ton_poker
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-used-anywhere
      TELEGRAM_BOT_TOKEN: 0:CI_FAKE_TOKEN_NOT_USED
      MINI_APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Generate Prisma client
        run: npx prisma generate --schema server/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
